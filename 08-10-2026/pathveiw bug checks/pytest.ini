[pytest]
addopts = -ra --strict-markers
xfail_strict = true
testpaths = tests
markers =
    core: main pathview pipeline checks
    mapping: molecule and pathway node mapping checks
    color: numeric-to-color checks
    parser: KGML or SBGN parser checks
    rendering: PNG, SVG, or PDF checks
    highlighting: post-render highlighting checks
    spline: curve and edge routing checks
    cli: command-line checks
    integration: external database integration checks using mocks
    slow: checks that render a complete frozen pathway
    live: optional checks that contact a third-party service
junit_family = xunit2

